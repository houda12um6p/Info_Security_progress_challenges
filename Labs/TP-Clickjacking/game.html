<!DOCTYPE html>
<html>
<head>
    <title>Catch Me!</title>

    <style>
        #catchButton {
            position: absolute;
            top: 150px;
            left: 700px;
        }

        iframe {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 500px;
            height: 300px;
            opacity: 0;
            z-index: 2;
        }
    </style>
</head>

<body>

    <h1>Catch Me!</h1>

    <p>
        Score: <span id="score">0</span>
    </p>
    <button onclick="revealAttack()">
    	Reveal Hidden Page
    </button>

    <button id="catchButton" onclick="catchMe()">
        Catch Me
    </button>

    <iframe src="portal.html" width="500" height="300"></iframe>

    <script>
        let score = 0;

        function catchMe() {
            score++;

            document.getElementById("score").textContent = score;

            let button = document.getElementById("catchButton");

            if (score === 4) {
                button.style.left = "300px";
                button.style.top = "260px";
            } else {
                let x = 650 + Math.floor(Math.random() * 250);
                let y = 100 + Math.floor(Math.random() * 350);

                button.style.left = x + "px";
                button.style.top = y + "px";
            }
        }
	function revealAttack() {
 		let frame = document.querySelector("iframe");
    		frame.style.opacity = "0.5";
	}
    </script>

</body>
</html>
